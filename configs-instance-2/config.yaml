server:
  http:
    addr: 127.0.0.1:8001
    timeout: 1s
  grpc:
    addr: 127.0.0.1:9001
    # 普通请求：Provider 60s < gRPC Server 65s < Gateway 70s。
    # Kratos 的这个选项仅作用于 unary RPC；流式调用由请求 Context 控制。
    timeout: 65s
data:
  database:
    driver: mysql
    source: root:root@tcp(127.0.0.1:3306)/test?parseTime=True&loc=Local
  redis:
    addr: 127.0.0.1:6379
    read_timeout: 0.2s
    write_timeout: 0.2s
